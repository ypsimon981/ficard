name: Apply FiCard v0.9.63 UI refinements

on:
  push:
    paths:
      - '.github/workflows/apply-ui-v063.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply loader and card preview refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re
          p=Path('index.html')
          text=p.read_text()
          marker='/* v0.9.63 · Reader loading feedback + larger main-card logo panel */'
          css='\n'+marker+'\n.cardItem .cardOpen{padding:7px 7px 14px}\n.cardItem .cardOpen .brandMark{width:100%;height:clamp(82px,25vw,96px);padding:12px 14px;border-radius:16px;margin:0;background:#fff}\n.cardItem .cardOpen .brandMark .brandLogo{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}\n.cardItem .cardOpen .name{margin-top:10px;margin-left:0;padding-left:0}\n.cardItem .cardOpen .type{margin-left:0;padding-left:0}\n.imageImportSheet{position:relative}\n.imageImportBusyOverlay{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:flex-start;flex-direction:column;gap:14px;padding:116px 24px 32px;background:rgba(248,249,252,.92);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:28px 28px 0 0;text-align:center;color:var(--text)}\n.imageImportBusyOverlay.show{display:flex}\n.imageImportSpinner{width:54px;height:54px;border:5px solid rgba(91,61,245,.16);border-top-color:var(--violet);border-right-color:var(--teal);border-radius:50%;animation:ficardReaderSpin .85s linear infinite}\n.imageImportBusyOverlay strong{font-size:18px;line-height:1.2}\n.imageImportBusyOverlay small{max-width:280px;color:var(--muted);font-size:13px;line-height:1.4}\n@keyframes ficardReaderSpin{to{transform:rotate(360deg)}}\n@media(prefers-reduced-motion:reduce){.imageImportSpinner{animation-duration:1.8s}}\n'
          if marker not in text:
              text=text.replace('</style>',css+'</style>',1)
          old_modal='<div id="imageImportModal" class="modal"><div class="sheet"><div class="sheetHead">'
          new_modal='<div id="imageImportModal" class="modal"><div class="sheet imageImportSheet"><div id="imageImportBusy" class="imageImportBusyOverlay" role="status" aria-live="polite"><div class="imageImportSpinner" aria-hidden="true"></div><strong id="imageImportBusyText">Analisi in corso…</strong><small>Fi-Card sta cercando il codice e riconoscendo il marchio. Può richiedere qualche secondo.</small></div><div class="sheetHead">'
          if old_modal in text:
              text=text.replace(old_modal,new_modal,1)
          elif 'id="imageImportBusy"' not in text:
              raise SystemExit('image import modal start not found')
          helper="function setImageImportBusy(active,label='Analisi in corso…'){const box=document.getElementById('imageImportBusy'),txt=document.getElementById('imageImportBusyText');if(txt)txt.textContent=label;if(box)box.classList.toggle('show',!!active)}\n"
          if 'function setImageImportBusy(' not in text:
              target='async function importImages(e){'
              if target not in text: raise SystemExit('importImages not found')
              text=text.replace(target,helper+target,1)
          start="showModal('imageImportModal');const status=document.getElementById('imageImportStatus');"
          start_new=start+"setImageImportBusy(true,'Analisi in corso…');"
          if start in text and start_new not in text: text=text.replace(start,start_new,1)
          read_line="status.textContent='Lettura immagine '+(i+1)+' di '+files.length+'…';"
          read_new=read_line+"setImageImportBusy(true,status.textContent);"
          if read_line in text and read_new not in text: text=text.replace(read_line,read_new,1)
          merchant_line="status.textContent='Riconoscimento negozio '+(i+1)+' di '+files.length+'…';"
          merchant_new=merchant_line+"setImageImportBusy(true,status.textContent);"
          if merchant_line in text and merchant_new not in text: text=text.replace(merchant_line,merchant_new,1)
          finally_old="}finally{if(scanner)try{scanner.clear()}catch(err){}imageImportBusy=false;await releaseMerchantOcr()}}"
          finally_new="}finally{setImageImportBusy(false);if(scanner)try{scanner.clear()}catch(err){}imageImportBusy=false;await releaseMerchantOcr()}}"
          if finally_old in text: text=text.replace(finally_old,finally_new,1)
          elif finally_new not in text: raise SystemExit('importImages finally block not found')
          now=datetime.now(ZoneInfo('Europe/Rome'))
          human=now.strftime('%d/%m/%Y · %H:%M · v0.9.63')
          release_id=now.strftime('%Y.%m.%d-%H%M-v0.9.63')
          text=re.sub(r'<div class="release">[^<]+</div>','<div class="release">'+human+'</div>',text,count=1)
          text=re.sub(r'const RELEASE="[^"]+";','const RELEASE="'+release_id+'";',text,count=1)
          if '<span class="changeVersion">v0.9.63</span>' not in text:
              entry='<details class="changeEntry" open><summary><span class="changeVersion">v0.9.63</span><span class="changeTitle">Lettore più chiaro e anteprime più pulite</span><time>'+now.strftime('%d/%m/%Y · %H:%M')+'</time></summary><ul><li>Animazione di elaborazione durante la lettura di foto e screenshot, con indicazione dello stato.</li><li>Riquadro bianco dei loghi ampliato fino a 7 px dai bordi laterali e superiore delle carte principali.</li><li>Nome della tessera riallineato al bordo sinistro del riquadro logo.</li></ul></details>'
              text=text.replace('<div class="changeList">','<div class="changeList">'+entry,1)
          p.write_text(text)
          sw=Path('sw.js')
          sw_text=sw.read_text()
          sw_text=re.sub(r'const CACHE="ficard-[^"]+";','const CACHE="ficard-'+release_id+'";',sw_text,count=1)
          sw.write_text(sw_text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Improve card reader feedback and card previews"
            git push origin main
          fi
