name: Apply FiCard compact bottom menu v0.9.136

on:
  push:
    paths:
      - '.github/workflows/bottom-menu-v0136.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact bottom menu
        run: python .github/scripts/bottom_menu_v0136.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ficard-polish.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Compact FiCard bottom navigation"
            git push origin main
          fi
