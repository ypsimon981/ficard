name: Apply FiCard CR80 proportions v0.9.132

on:
  push:
    paths:
      - '.github/workflows/cr80-v0132.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CR80 proportions
        run: python .github/scripts/cr80_v0132.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ficard-polish.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Use CR80 proportions for FiCard previews"
            git push origin main
          fi
