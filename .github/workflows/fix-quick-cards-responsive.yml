name: Fix responsive quick cards

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-quick-cards-responsive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make quick cards responsive
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()

          css = '''
/* v0.9.59 · Responsive quick cards: always fit two cards on phone width */
.smartCarousel:not(.denseNearby):not(.proximityFocus){gap:10px}
.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartCard{flex:0 0 calc((100% - 10px)/2);min-width:0;max-width:none;min-height:112px;aspect-ratio:1.32}
.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartCardOpen{padding:clamp(9px,3vw,13px) clamp(9px,3vw,13px) 44px}
.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartCard .brandMark{height:clamp(52px,16vw,70px);padding:clamp(6px,2.5vw,11px);border-radius:clamp(10px,3vw,14px)}
.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartCard .brandMark .brandLogo{max-width:100%;max-height:100%}
.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartCard .name{font-size:clamp(12px,3.4vw,14px);margin-top:clamp(6px,2vw,9px)}
.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartMeta{font-size:clamp(10px,2.8vw,11px)}
@media(max-width:350px){.smartBlock{padding-left:12px;padding-right:12px}.smartCarousel:not(.denseNearby):not(.proximityFocus){gap:8px}.smartCarousel:not(.denseNearby):not(.proximityFocus) .smartCard{flex-basis:calc((100% - 8px)/2);min-height:106px;border-radius:18px}}
'''

          if '/* v0.9.59 · Responsive quick cards' not in text:
              text = text.replace('</style>', css + '</style>', 1)

          text = text.replace('03/10/2026 · 22:27 · v0.9.58', '04/10/2026 · 07:48 · v0.9.59')
          text = text.replace('const RELEASE="2026.10.03-2227-v0.9.58";', 'const RELEASE="2026.10.04-0748-v0.9.59";')
          index.write_text(text)

          sw = Path('sw.js')
          sw_text = sw.read_text().replace('ficard-2026.10.03-2227-v0.9.58', 'ficard-2026.10.04-0748-v0.9.59')
          sw.write_text(sw_text)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Make quick cards responsive on narrow phones"
            git push origin main
          fi
