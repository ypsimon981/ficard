name: Fix FiCard usage grid v0.9.65

on:
  push:
    paths:
      - '.github/workflows/fix-usage-grid-v065.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply usage-grid layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          p=Path('index.html')
          text=p.read_text()
          marker='/* v0.9.65 · Usage grid matches classic two-column card layout */'
          css='''\n/* v0.9.65 · Usage grid matches classic two-column card layout */\n.usageGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}\n.usageGrid .card{width:100%;min-width:0;min-height:0!important;height:auto!important;aspect-ratio:85.6/53.98!important;padding:0!important;border-radius:18px;background:var(--card-color);color:var(--card-ink,#fff);box-shadow:0 3px 10px rgba(31,41,55,.06)}\n.usageGrid .card .cardOpen{height:100%;padding:7px 7px 10px;display:flex;flex-direction:column;align-items:stretch}\n.usageGrid .card .brandMark{width:100%;height:auto;flex:0 0 56%;min-height:0;padding:8px 10px;border-radius:14px;margin:0;background:#fff}\n.usageGrid .card .brandMark .brandLogo{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}\n.usageGrid .card .name{font-size:clamp(12px,3.6vw,15px);margin:7px 0 0;padding:0 24px 0 0;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.usageGrid .card .type{display:none}\n.usageGrid .empty{grid-column:1/-1}\n@media(min-width:520px){.usageGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}\n'''
          if marker not in text:
              text=text.replace('</style>',css+'\n</style>',1)

          now=datetime.now(ZoneInfo('Europe/Rome'))
          human=now.strftime('%d/%m/%Y · %H:%M · v0.9.65')
          release_id=now.strftime('%Y.%m.%d-%H%M-v0.9.65')
          text=re.sub(r'<div class="release">[^<]+</div>','<div class="release">'+human+'</div>',text,count=1)
          text=re.sub(r'const RELEASE="[^"]+";','const RELEASE="'+release_id+'";',text,count=1)
          if '<span class="changeVersion">v0.9.65</span>' not in text:
              entry='<details class="changeEntry" open><summary><span class="changeVersion">v0.9.65</span><span class="changeTitle">Più usate a due colonne</span><time>'+now.strftime('%d/%m/%Y · %H:%M')+'</time></summary><ul><li>La vista Più usate ora usa due tessere per riga.</li><li>Le proporzioni sono le stesse del formato tessera classico introdotto nella home.</li></ul></details>'
              text=text.replace('<div class="changeList">','<div class="changeList">'+entry,1)
          p.write_text(text)

          sw=Path('sw.js')
          sw_text=sw.read_text()
          sw_text=re.sub(r'const CACHE="ficard-[^"]+";','const CACHE="ficard-'+release_id+'";',sw_text,count=1)
          sw.write_text(sw_text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Make usage grid two columns"
            git push origin main
          fi
