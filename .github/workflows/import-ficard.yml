name: Import FiCard from legacy repository

on:
  push:
    paths:
      - '.github/workflows/import-ficard.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new FiCard repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current FiCard from legacy repository
        run: |
          git clone --depth 1 https://github.com/ypsimon981/ypsimon981.github.io.git /tmp/legacy
          test -f /tmp/legacy/fi-card/index.html

      - name: Replace repository app files with FiCard subtree
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +
          cp -a /tmp/legacy/fi-card/. ./
          cat > README.md <<'EOF'
          # FiCard

          Repository dedicato a FiCard.

          La web app vive direttamente nella root del repository. La base iniziale è stata migrata dalla precedente cartella `fi-card/` del repository legacy, così FiCard può evolvere separatamente dagli altri progetti.
          EOF

      - name: Commit migrated FiCard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate"
            exit 0
          fi
          git commit -m "Migrate current FiCard into dedicated repository"
          git push origin HEAD:main
