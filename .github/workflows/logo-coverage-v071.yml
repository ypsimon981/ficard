name: Expand FiCard logo coverage v0.9.71

on:
  push:
    paths:
      - '.github/workflows/logo-coverage-v071.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply logo coverage patch
        run: python .github/scripts/logo_coverage_v071.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Expand FiCard brand logo coverage"
            git push origin main
          fi
