name: Refine FiCard logo rendering v0.9.68

on:
  push:
    paths:
      - '.github/workflows/logo-render-v068.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply logo rendering patch
        run: python .github/scripts/logo_render_patch_v068.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Refine wallet logo rendering"
            git push origin main
          fi
