name: Extend FiCard wallet style v0.9.69

on:
  push:
    paths:
      - '.github/workflows/quick-detail-wallet-v069.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/quick_detail_wallet_patch_v069.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extend wallet style to quick cards and detail"
            git push origin main
          fi
