name: Rework add card flow

on:
  push:
    paths:
      - '.github/workflows/rework-add-card-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply add-card flow patch
        run: echo '' | base64 -d > /tmp/patch.py && python /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Put card acquisition first in add flow"
          git push origin main
