name: Apply FiCard compact spacing v0.9.133

on:
  push:
    paths:
      - '.github/workflows/spacing-v0133.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply spacing refinements
        run: python .github/scripts/spacing_v0133.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ficard-polish.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Tighten FiCard home spacing"
            git push origin main
          fi
