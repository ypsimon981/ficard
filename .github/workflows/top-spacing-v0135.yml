name: Apply FiCard compact aligned header v0.9.135

on:
  push:
    paths:
      - '.github/workflows/top-spacing-v0135.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply header refinement
        run: python .github/scripts/top_spacing_v0135.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ficard-polish.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Tighten and align FiCard header"
            git push origin main
          fi
