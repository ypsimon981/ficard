name: Apply FiCard wallet card style v0.9.67

on:
  push:
    paths:
      - '.github/workflows/wallet-card-style-v067.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wallet card style
        shell: bash
        run: |
          echo ' gIiBkYXRhLWJyYW5kPSInK2VzYyhjLmJyYW5kS2V5fHwnJykrJyIgc3R5bGU9Ii0tY2FyZC1jb2xvcjonK2VzYyhjLmNvbG9yKSsnOy0tY2FyZC1pbms6JytjYXJkSW5rKGMuY29sb3IpKyc ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Apply wallet-style loyalty cards"
            git push origin main
          fi
