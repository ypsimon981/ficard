name: Apply FiCard wallet card style v0.9.67

on:
  push:
    paths:
      - '.github/workflows/wallet-card-style-v067.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wallet card style
        run: python .github/scripts/wallet_patch_v067.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Apply wallet-style loyalty cards"
            git push origin main
          fi
