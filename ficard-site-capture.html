/* White variants where the original mark loses contrast */
.smartCard[data-brand=&quot;ovs&quot;] .brandLogo,
.smartCard[data-brand=&quot;pittarosso&quot;] .brandLogo,
.detailBrandHeader[data-brand=&quot;ovs&quot;] .brandLogo,
.detailBrandHeader[data-brand=&quot;pittarosso&quot;] .brandLogo,
.fullCardLogo .brandLogo[src$=&quot;/ovs.svg&quot;],
.fullCardLogo .brandLogo[src$=&quot;/pittarosso.svg&quot;]{
  filter:brightness(0) invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.18))!important;
}

/* Existing dark-background variants extended to quick/detail cards */

.cardItem::before,.smartCard::before{
 content:&quot;&quot;;position:absolute;inset:0;z-index:0;pointer-events:none;
 background:rgba(0,0,0,.12);
 -webkit-mask-image:radial-gradient(ellipse 100% 100% at 0% 0%,transparent 99.8%,#000 100%);
 mask-image:radial-gradient(ellipse 100% 100% at 0% 0%,transparent 99.8%,#000 100%);
}

  const lock=cardWakeLock;cardWakeLock=null;if(lock)try{await lock.release()}catch(e){}return;

  const lock=await navigator.wakeLock.request(&#x27;screen&#x27;);
  if(!cardScreenVisible()||document.visibilityState!==&quot;visible&quot;){await lock.release();return}

.locationResult{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center}
.locationResult .grow{min-width:0;overflow-wrap:break-word}.locationResult small{display:block}
.locationResult .grow b,.locationResult .grow small{overflow-wrap:break-word;word-break:normal}
#cardNearbyStores h3{font-size:16px;margin:18px 0 8px}
.leaflet-popup-content .locationResult{box-shadow:none;border:0;padding:0;margin:0;grid-template-columns:40px minmax(0,1fr);font-size:14px}
.leaflet-popup-content .locationBrandIcon{width:40px;height:40px;min-width:40px}
.leaflet-popup-content .shopActions{margin-top:6px}
.leaflet-popup-content .shopActions .chip{padding:8px 10px;font-size:13px}
/* A quiet, corner-to-corner tonal arc on previews only. */
.cardItem,.smartCard{isolation:isolate}
.cardItem::before,.smartCard::before{
 content:&quot;&quot;;position:absolute;inset:0;z-index:0;pointer-events:none;
 background:rgba(0,0,0,.12);
 -webkit-mask-image:radial-gradient(ellipse 100% 100% at 0% 0%,transparent 99.8%,#000 100%);
 mask-image:radial-gradient(ellipse 100% 100% at 0% 0%,transparent 99.8%,#000 100%);
}
/* v0.9.71 · Expanded logo coverage */
.brandLogoRemote{object-fit:contain!important;image-rendering:auto!important}
.cardItem .brandLogoRemote,.smartCard .brandLogoRemote,.detailBrandHeader .brandLogoRemote{max-width:68%!important;max-height:72%!important}
.brandLogoFallback{font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1.05}


/* v0.9.72 · HQ logos for key brands */
.cardItem[data-brand=&quot;acquaesapone&quot;] .brandLogo,.smartCard[data-brand=&quot;acquaesapone&quot;] .brandLogo,.detailBrandHeader[data-brand=&quot;acquaesapone&quot;] .brandLogo{max-width:82%!important;max-height:70%!important}
.cardItem[data-brand=&quot;footlocker&quot;] .brandLogo,.smartCard[data-brand=&quot;footlocker&quot;] .brandLogo,.detailBrandHeader[data-brand=&quot;footlocker&quot;] .brandLogo{max-width:80%!important;max-height:58%!important}
.cardItem[data-brand=&quot;penny&quot;] .brandLogo,.smartCard[data-brand=&quot;penny&quot;] .brandLogo,.detailBrandHeader[data-brand=&quot;penny&quot;] .brandLogo{max-width:62%!important;max-height:72%!important}

body.scannerBridge&gt; :not(#addModal):not(#toast):not(script){display:none!important}
body.scannerBridge #addModal{padding:0;background:#F8F9FC}
body.scannerBridge #addModal .sheet{width:100%;max-width:none;max-height:100dvh;min-height:100dvh;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top))}
    .bottom .nav{min-width:0;min-height:44px;padding:4px 0;font-size:10px}
    body.scanSectionOpen .top{display:none}
    #scandixitView{position:fixed;inset:0 0 calc(78px + env(safe-area-inset-bottom));max-width:580px;margin:auto;z-index:10;background:var(--bg)}

.detailBrandHeader{position:relative}
.detailFavorite{position:absolute;top:12px;right:12px;z-index:2;display:grid;place-items:center;width:44px;height:44px;padding:5px;border:0;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 3px 10px rgba(31,41,55,.12)}
.detailFavorite svg{width:32px;height:32px;display:block}
.detailToolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.detailToolbar button{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--violet);padding:10px}
.detailToolbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.detailToolbar button:focus-visible,.detailFavorite:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.cardLocations{margin-top:14px}

.cardLocations .detailActions{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0;margin-bottom:12px}
.cardLocations .detailActions button{padding:12px 8px;font-size:12px}
#deleteBtn{background:transparent;border:0;font-size:12px;font-weight:600;min-height:44px;margin-top:8px;padding:10px;color:var(--danger)}

  const lock=cardWakeLock;cardWakeLock=null;if(lock)try{await lock.release()}catch(e){}return;

  const lock=await navigator.wakeLock.request(&#x27;screen&#x27;);
  if(!cardScreenVisible()||document.visibilityState!==&quot;visible&quot;){await lock.release();return}

.locationResult{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center}
.locationResult .grow{min-width:0;overflow-wrap:break-word}.locationResult small{display:block}
.locationResult .grow b,.locationResult .grow small{overflow-wrap:break-word;word-break:normal}
#cardNearbyStores h3{font-size:16px;margin:18px 0 8px}
.leaflet-popup-content .locationResult{box-shadow:none;border:0;padding:0;margin:0;grid-template-columns:40px minmax(0,1fr);font-size:14px}
.leaflet-popup-content .locationBrandIcon{width:40px;height:40px;min-width:40px}
.leaflet-popup-content .shopActions{margin-top:6px}
.leaflet-popup-content .shopActions .chip{padding:8px 10px;font-size:13px}
/* A quiet, corner-to-corner tonal arc on previews only. */
.cardItem,.smartCard{isolation:isolate}
.cardItem::before,.smartCard::before{
 content:&quot;&quot;;position:absolute;inset:0;z-index:0;pointer-events:none;
 background:rgba(0,0,0,.12);
 -webkit-mask-image:radial-gradient(ellipse 100% 100% at 0% 0%,transparent 99.8%,#000 100%);
 mask-image:radial-gradient(ellipse 100% 100% at 0% 0%,transparent 99.8%,#000 100%);
}
/* v0.9.71 · Expanded logo coverage */
.brandLogoRemote{object-fit:contain!important;image-rendering:auto!important}
.cardItem .brandLogoRemote,.smartCard .brandLogoRemote,.detailBrandHeader .brandLogoRemote{max-width:68%!important;max-height:72%!important}
.brandLogoFallback{font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1.05}


/* v0.9.72 · HQ logos for key brands */
.cardItem[data-brand=&quot;acquaesapone&quot;] .brandLogo,.smartCard[data-brand=&quot;acquaesapone&quot;] .brandLogo,.detailBrandHeader[data-brand=&quot;acquaesapone&quot;] .brandLogo{max-width:82%!important;max-height:70%!important}
.cardItem[data-brand=&quot;footlocker&quot;] .brandLogo,.smartCard[data-brand=&quot;footlocker&quot;] .brandLogo,.detailBrandHeader[data-brand=&quot;footlocker&quot;] .brandLogo{max-width:80%!important;max-height:58%!important}
.cardItem[data-brand=&quot;penny&quot;] .brandLogo,.smartCard[data-brand=&quot;penny&quot;] .brandLogo,.detailBrandHeader[data-brand=&quot;penny&quot;] .brandLogo{max-width:62%!important;max-height:72%!important}

body.scannerBridge&gt; :not(#addModal):not(#toast):not(script){display:none!important}
body.scannerBridge #addModal{padding:0;background:#F8F9FC}
body.scannerBridge #addModal .sheet{width:100%;max-width:none;max-height:100dvh;min-height:100dvh;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top))}
    .bottom .nav{min-width:0;min-height:44px;padding:4px 0;font-size:10px}
    body.scanSectionOpen .top{display:none}
    #scandixitView{position:fixed;inset:0 0 calc(78px + env(safe-area-inset-bottom));max-width:580px;margin:auto;z-index:10;background:var(--bg)}

.detailBrandHeader{position:relative}
.detailFavorite{position:absolute;top:12px;right:12px;z-index:2;display:grid;place-items:center;width:44px;height:44px;padding:5px;border:0;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 3px 10px rgba(31,41,55,.12)}
.detailFavorite svg{width:32px;height:32px;display:block}
.detailToolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.detailToolbar button{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--violet);padding:10px}
.detailToolbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.detailToolbar button:focus-visible,.detailFavorite:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.cardLocations{margin-top:14px}

.cardLocations .detailActions{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0;margin-bottom:12px}
.cardLocations .detailActions button{padding:12px 8px;font-size:12px}
#deleteBtn{background:transparent;border:0;font-size:12px;font-weight:600;min-height:44px;margin-top:8px;padding:10px;color:var(--danger)}

  const lock=cardWakeLock;cardWakeLock=null;if(lock)try{await lock.release()}catch(e){}return;

  const lock=await navigator.wakeLock.request(&#x27;screen&#x27;);
  if(!cardScreenVisible()||document.visibilityState!==&quot;visible&quot;){await lock.release();return}
